:root{--bg:#ffffff;--ink:#000000;--mute:#8a8a8a;--rule:#dcdcdc;--tint:#f2f2f2;--s1:#000000;--s2:#8a8a8a;--s3:#c4c4c4;--s4:#e8e8e8;--bar:rgba(255,255,255,.94);
  --font:Pretendard,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--ink:#ececec;--mute:#9a9a9a;--rule:#333333;--tint:#1f1f1f;--s1:#ececec;--s2:#9a9a9a;--s3:#5a5a5a;--s4:#333333;--bar:rgba(20,20,20,.94);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--ink:#ececec;--mute:#9a9a9a;--rule:#333333;--tint:#1f1f1f;--s1:#ececec;--s2:#9a9a9a;--s3:#5a5a5a;--s4:#333333;--bar:rgba(20,20,20,.94);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;letter-spacing:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select{font:inherit;color:inherit;letter-spacing:0}
button{cursor:pointer;background:transparent;border:1px solid var(--rule);padding:6px 10px}
button:hover{border-color:var(--ink)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{display:flex;min-height:100vh}
.rail{width:216px;flex-shrink:0;border-right:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding:22px 16px 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.brand{padding:0 6px 18px;border-bottom:1px solid var(--ink);margin-bottom:12px}
.brand b{display:block;font-size:15px;letter-spacing:0}
.brand b svg{display:block;width:150px;max-width:100%;height:auto;color:var(--ink)}
.brand span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;gap:10px;align-items:baseline;border:0;padding:8px 6px;text-align:left;font-size:13px;color:var(--mute);border-left:2px solid transparent}
.rail nav button i{font-style:normal;font-size:11px;width:18px;color:var(--mute)}
.rail nav button[aria-current="true"]{color:var(--ink);font-weight:700;border-left-color:var(--ink);background:var(--tint)}
.rail .src{margin-top:auto;font-size:11px;color:var(--mute);line-height:1.5;padding:12px 6px 0;border-top:1px solid var(--rule)}
.main{flex:1;min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .ttl{margin-right:auto;min-width:0}
.bar .ttl b{font-size:15px;display:block}
.bar .ttl span{font-size:11.5px;color:var(--mute);display:block}
.bar label{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.bar select{border:1px solid var(--rule);background:var(--bg);padding:6px 8px;font-size:13px}
.bar button.tog{font-size:13px}
.bar button.tog[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.content{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px;max-width:1180px}
section{scroll-margin-top:84px;min-width:0}
.eyebrow{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
h2{font-size:18px;margin:2px 0 0;font-weight:700;text-wrap:balance}
.sub{font-size:12px;color:var(--mute);margin:2px 0 14px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{border-top:1px solid var(--ink);padding:10px 0 6px;min-width:0}
.card .lab{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .val{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15}
.card .dl{font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .dl b{color:var(--ink)}
.card .dl.na{color:var(--mute)}
.card svg{display:block;margin-top:8px;max-width:100%}
.two{grid-template-columns:1.9fr 1fr}
.tile{border-top:1px solid var(--ink);padding-top:10px;min-width:0}
.tile .th{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tile .th b{font-size:13px}
.seg{display:flex;gap:2px;flex-wrap:wrap}
.seg button{border:1px solid var(--rule);padding:3px 8px;font-size:11.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.chart{position:relative;width:100%}
.chart .tip{position:absolute;top:0;right:0;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;background:var(--bg);padding:0 2px}
.chart .tip b{color:var(--ink)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.comp{display:grid;gap:8px}
.comp .row{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto auto;gap:10px;align-items:center;font-size:12.5px}
.comp .track{height:10px;background:var(--tint);min-width:0}
.comp .fill{height:100%;background:var(--s1)}
.comp .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.comp .p{font-variant-numeric:tabular-nums;color:var(--mute);width:36px;text-align:right}
.tw{overflow-x:auto;border-top:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--mute);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:2px}
td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle}
td.l{text-align:left}
tr.sum td{border-top:1px solid var(--ink);border-bottom:0;font-weight:700}
td .ib{position:relative;display:inline-block;min-width:92px;text-align:right}
td .ib i{position:absolute;inset:2px 0;left:auto;right:0;background:var(--tint);z-index:0}
td .ib span{position:relative;z-index:1}
.mute{color:var(--mute)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border:1px solid var(--ink);white-space:nowrap}
.tag.m{border-color:var(--rule);color:var(--mute)}
.meter{display:inline-flex;gap:2px;margin-left:8px;vertical-align:1px}
.meter i{display:inline-block;width:12px;height:5px;background:var(--rule)}
.meter i.on{background:var(--ink)}
.hbars{display:grid;gap:10px;margin-bottom:18px}
.hbars .row{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:12px;align-items:center;font-size:12.5px}
.hbars .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbars .pair{display:grid;gap:3px}
.hbars .b{display:flex;align-items:center;gap:8px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.hbars .b i{display:block;height:9px;background:var(--s3);min-width:1px}
.hbars .b.rv i{background:var(--s1)}
.hbars .b.rv{color:var(--ink);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 24px;font-size:13px;margin-bottom:18px}
.facts div{display:flex;gap:10px;border-bottom:1px solid var(--rule);padding:6px 0}
.facts span{color:var(--mute);width:72px;flex-shrink:0;font-size:12px}
.facts b{font-weight:500;min-width:0;word-break:break-all}
h3{font-size:13px;margin:18px 0 8px}
ul.plain{margin:0;padding-left:16px;font-size:12.5px;color:var(--mute)}
.note{font-size:11.5px;color:var(--mute);line-height:1.6;margin-top:10px}
footer{padding:18px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule);font-size:11.5px;color:var(--mute);line-height:1.6}
.badge{display:inline-block;border:1px solid var(--ink);padding:1px 6px;font-size:10.5px;font-weight:700;margin-left:8px;vertical-align:1px;font-style:normal}
.verdict{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px 22px;background:var(--tint);padding:16px 18px 14px;margin:0 0 18px;border-top:2px solid var(--ink)}
.verdict .vg{display:flex;flex-direction:column;gap:4px}
.verdict .vl{font-size:11px;color:var(--mute);letter-spacing:.04em}
.verdict .vgrade{font-size:30px;font-weight:700;line-height:1.1}
.verdict .vgrade .meter{margin-left:0;margin-top:6px;display:flex}
.verdict .vb{font-size:11px;color:var(--mute);line-height:1.5;margin-top:6px}
.verdict .vb b{color:var(--ink);font-weight:600}
.verdict .vbody{display:grid;gap:12px;min-width:0}
.verdict table{font-size:12.5px;background:transparent}
.verdict th{padding:4px 8px;border-bottom:1px solid var(--ink);background:transparent}
.verdict td{padding:5px 8px;border-bottom:1px solid var(--rule);background:transparent}
.verdict tr:last-child td{border-bottom:0}
.verdict .vlines{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px;line-height:1.5}
.verdict .vlines li{padding-left:0}
.verdict .vlines b{font-weight:700}
.verdict .strip{display:flex;flex-wrap:wrap;gap:6px}
.verdict .strip>span{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px;padding:5px 4px;background:var(--bg);border:1px solid var(--rule);font-size:11px;color:var(--mute)}
.verdict .strip>span>b{color:var(--ink);font-size:12px}
.verdict .strip .meter{margin:0}
.verdict .strip .meter i{width:7px;height:4px}
.verdict .chips{display:flex;flex-wrap:wrap;gap:6px}

  $('#mediaNote').textContent=hasT?`평가 기준 목표 ROAS ${roasF(T.roas)} 달성률 100% 탁월 · 90% 우수 · 80% 양호 · 미만 보완`:`표 평가 열은 목표치 투입 시 표기. 상단 판독 등급은 ${vmd?esc(vmd.src):'기준선'} ROAS 대비 달성률 100% 탁월 · 90% 우수 · 80% 양호 · 미만 보완`;

  const cp=by(cur,'c',now);const cm={};for(const r of cur){(cm[r.c||'(미지정)']=cm[r.c||'(미지정)']||new Set()).add(r.m);}const mxc=Math.max(...cp.map(c=>Math.max(c.sp,c.rv)),1);
  $('#campBars').innerHTML=cp.map(c=>`<div class="row"><div class="name" title="${esc(c.name)}">${esc(c.name)}</div><div class="pair"><div class="b rv"><i style="width:${(c.rv/mxc*76).toFixed(1)}%"></i>${won(c.rv)}</div><div class="b"><i style="width:${(c.sp/mxc*76).toFixed(1)}%"></i>${won(c.sp)}</div></div></div>`).join('')+`<div class="legend"><span><i style="background:var(--s1)"></i>매출</span><span><i style="background:var(--s3)"></i>지출</span></div>`;
  $('#tblCamp').innerHTML=`<thead><tr><th>캠페인</th><th>매체</th><th>지출</th><th>비중</th><th>CTR</th><th>CPC</th><th>전환</th><th>전환율</th><th>CPA</th><th>매출</th><th>ROAS</th><th>판단</th></tr></thead><tbody>`+
    cp.map(c=>{const t=tag(c.roas,ref,c.share);return `<tr><td class="l"><b>${esc(c.name)}</b></td><td class="l mute">${esc([...cm[c.name]].sort().join(' · '))}</td><td>${won(c.sp)}</td><td>${pct(c.share*100,0)}</td><td>${pct(c.ctr,2)}</td><td>${wonF(c.cpc)}</td><td>${num(c.cv)}</td><td>${pcv(c.cvr)}</td><td>${wonF(c.cpa)}</td><td>${won(c.rv)}</td><td><b>${roasF(c.roas)}</b></td><td><span class="tag ${t==='유지'||t==='테스트'?'m':''}">${t}</span></td></tr>`;}).join('')+`</tbody>`;
  $('#campNote').textContent=`판단 기준 ROAS ${roasF(ref)}${T&&T.roas?' (목표)':' (기간 전체 평균)'} 대비 1.3배 이상 확대 · 1.0 유지 · 0.7 개선 · 미만 재검토, 지출 비중 5% 미만 테스트`;
  /* 타깃 · 소재 */
  const tg=by(cur,'t',now);
  $('#tblTarget').innerHTML=`<thead><tr><th>타깃</th><th>지출</th><th>비중</th><th>CTR</th><th>CPC</th><th>전환율</th><th>매출</th><th>ROAS</th></tr></thead><tbody>`+tg.map(t=>`<tr><td class="l"><b>${esc(t.name)}</b></td><td>${won(t.sp)}</td><td>${pct(t.share*100,0)}</td><td>${pct(t.ctr,2)}</td><td>${wonF(t.cpc)}</td><td>${pcv(t.cvr)}</td><td>${won(t.rv)}</td><td><b>${roasF(t.roas)}</b></td></tr>`).join('')+`</tbody>`;
  const km={};for(const r of cur){(km[r.k||'(미지정)']=km[r.k||'(미지정)']||new Set()).add(r.m);}
  const cr=by(cur,'k',now).sort((a,b)=>((b.share>=.03)-(a.share>=.03))||((b.roas||0)-(a.roas||0))).slice(0,10);
  const vd=dataVerdict(now,days.length,new Set(cur.map(r=>r.d)).size);$('#vData').innerHTML=vpanel(vd,'신뢰도 판독','기준 완전성 · 이상치 영향 · 전환 표본 · 집행 연속성, 종합 = 4항목 평균',`<div class="chips">${vd.items.map(i=>`<span><b>${i.label}</b> <b>${i.grade}</b>${meter(i.grade)}</span>`).join('')}</div>`);
  $('#tblCreative').innerHTML=`<thead><tr><th>소재</th><th>매체</th><th>지출</th><th>CTR</th><th>전환율</th><th>ROAS</th></tr></thead><tbody>`+cr.map(c=>`<tr><td class="l"><b>${esc(c.name)}</b></td><td class="l mute">${esc([...km[c.name]].sort().join(' · '))}</td><td>${won(c.sp)}</td><td>${pct(c.ctr,2)}</td><td>${pcv(c.cvr)}</td><td><b>${roasF(c.roas)}</b></td></tr>`).join('')+`</tbody>`;
}
/* ---- 정적 구간 (데이터 점검 · 푸터) ---- */
function renderStatic(){
  const q=M.quality;const f=[['출처',M.source],['기간',`${M.range.label} (${M.range.days}일${M.range.active_days?`, 집행 ${M.range.active_days}일`:''})`],['브랜드',(M.brands&&M.brands.length?M.brands.join(' · '):'미기재')],['매체',M.media.join(' · ')],['행 수',`원본 ${num(q.rows_raw)} · 정제 ${num(q.rows_clean)}`],['컬럼',Object.entries(M.columns.mapped).map(([k,v])=>k===v?k:`${k}(${v})`).join(' · ')],['미매핑',M.columns.unmapped.length?M.columns.unmapped.join(' · '):'없음'],['단위','금액 원 · VAT 별도, 전환 = 구매']];
  $('#facts').innerHTML=f.map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('');
  $('#tblQuality').innerHTML=`<thead><tr><th>항목</th><th>건수</th><th style="text-align:left">처리</th></tr></thead><tbody>`+q.log.map(l=>`<tr><td class="l">${esc(l['항목'])}</td><td>${num(l['건수'])}</td><td class="l mute">${esc(l['처리'])}</td></tr>`).join('')+`</tbody>`;
  $('#outliers').innerHTML=q.outliers.length?`<h3>이상치 상세 (확인 요청, 집계 유지)</h3><ul class="plain">${q.outliers.slice(0,10).map(o=>`<li>${esc(o)}</li>`).join('')}${q.outliers.length>10?`<li>외 ${q.outliers.length-10}건 (review.json 참조)</li>`:''}</ul>`:'';
  $('#tblDefs').innerHTML=`<thead><tr><th>지표</th><th style="text-align:left">산식</th></tr></thead><tbody>`+M.kpi_defs.map(d=>`<tr><td class="l"><b>${d[0]}</b></td><td class="l">${d[1]}</td></tr>`).join('')+`</tbody>`;
  $('#ruleNote').textContent='원칙: 데이터에 없는 수치는 만들지 않음. 완전 중복 행 제거, 전환 0 행의 전환액 공란 0 처리 외 임의 수정 없음. 이상치는 확인 요청 후 유지.';
  $('#railSrc').innerHTML=`출처 ${esc(M.source)}<br>기준일 ${esc(M.generated)}${M.sample?'<br><span class="badge" style="margin:6px 0 0">샘플 데이터</span>':''}`;
  $('#foot').innerHTML=`${esc(M.title)} · 출처 ${esc(M.source)} · 기준일 ${esc(M.generated)} · 모든 수치는 첨부 데이터 집계값, 금액 VAT 별도${M.sample?' · 샘플(더미) 데이터, 실제 집행 수치와 무관':''}`;
  $('#barTitle').textContent=M.title;if(M.sample){$('#barTitle').insertAdjacentHTML('beforeend','<em class="badge">샘플</em>');}
  if(M.logo_svg){$('#brandName').innerHTML=M.logo_svg;}else if(M.brand_en){$('#brandName').textContent=M.brand_en;}
}
/* ---- 구간 표시 · 번호 ---- */
(function(){const hide=id=>{const s=document.getElementById(id);if(s)s.hidden=true;const b=document.querySelector(`#nav button[data-go="${id}"]`);if(b)b.hidden=true;};
  if(!HAS.months)hide('monthly');if(!HAS.c)hide('campaign');if(!HAS.t&&!HAS.k)hide('target');
  if(HAS.t&&!HAS.k){$('#tblCreative').closest('div').hidden=true;}if(HAS.k&&!HAS.t){$('#tblTarget').closest('div').hidden=true;}
  let n=0;document.querySelectorAll('section[id]').forEach(s=>{if(s.hidden)return;n++;const nn=String(n).padStart(2,'0');const e=s.querySelector('.eyebrow');if(e)e.textContent=`${nn} ${e.dataset.tag||''}`;const b=document.querySelector(`#nav button[data-go="${s.id}"] i`);if(b)b.textContent=nn;});})();
/* ---- 컨트롤 ---- */
const ranges=[7,14,28,56,91,182].filter(n=>n<=N);if(!ranges.includes(N))ranges.push(N);ranges.sort((a,b)=>a-b);
$('#selRange').innerHTML=((A.period&&A.period.month)?`<option value="month" selected>${A.period.month} (${monthDays(A.period.start.slice(0,7)).length}일)</option>`:'')+ranges.map(n=>`<option value="${n}" ${n===state.range?'selected':''}>${n===N&&![7,14,28,56,91,182].includes(n)?'전체 ':''}${n}일</option>`).join('');
$('#selMedia').innerHTML=['전체',...M.media].map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
$('#selRange').addEventListener('change',e=>{state.range=e.target.value==='month'?'month':+e.target.value;render();});
$('#selMedia').addEventListener('change',e=>{state.media=e.target.value;render();});
$('#btnCompare').addEventListener('click',e=>{state.compare=!state.compare;e.currentTarget.setAttribute('aria-pressed',String(state.compare));render();});
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.go).scrollIntoView({block:'start'});}));
const secs=[...document.querySelectorAll('section[id]')];
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===e.target.id)));}});},{rootMargin:'-30% 0px -60% 0px'});secs.forEach(s=>io.observe(s));}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120);});
renderStatic();render();
})();
</script>

</body>
